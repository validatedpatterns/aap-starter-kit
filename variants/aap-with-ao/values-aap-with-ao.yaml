---
clusterGroup:
  name: aap-with-ao
  isHubCluster: true
  namespaces:
    vault:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    ansible-automation-platform:
    aap-config:
    cloudnative-pg:
      operatorGroup: true
      targetNamespaces: []
    automation-orchestrator:
      operatorGroup: true
      targetNamespaces: []
  subscriptions:
    aap-operator:
      name: ansible-automation-platform-operator
      namespace: ansible-automation-platform
      channel: stable-2.7
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    # CloudNativePG is certified but not supported by Red Hat for AO.
    # Prefer an externally supported PostgreSQL 15 when required.
    cloudnative-pg:
      name: cloudnative-pg
      namespace: cloudnative-pg
      channel: stable-v1
      source: certified-operators
    automation-orchestrator:
      name: automation-orchestrator-operator
      namespace: automation-orchestrator
      channel: stable
  applications:
    aap:
      name: ansible-automation-platform
      namespace: ansible-automation-platform
      chart: ansible-automation-platform-instance
      chartVersion: 0.1.*
      extraValueFiles:
        - $patternref/overrides/values-aap-instance-minimal.yaml
    aap-config:
      name: aap-config
      namespace: aap-config
      chart: aap-config
      chartVersion: 0.2.*
      extraValueFiles:
        - $patternref/overrides/values-aap-config-aeg.yaml
    vp-cloudnative-pg-cluster:
      name: vp-cloudnative-pg-cluster
      namespace: automation-orchestrator
      repoURL: https://github.com/validatedpatterns/vp-cloudnative-pg-cluster-chart.git
      chartVersion: main
      path: "."
      extraValueFiles:
        - $patternref/overrides/values-vp-cloudnative-pg-ao.yaml
    automation-orchestrator:
      name: automation-orchestrator
      namespace: automation-orchestrator
      repoURL: https://github.com/validatedpatterns/automation-orchestrator-instance-chart.git
      chartVersion: main
      path: "."
    vault:
      name: vault
      namespace: vault
      chart: hashicorp-vault
      chartVersion: 0.1.*
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
  imperative: {}
  managedClusterGroups: {}
