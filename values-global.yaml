---
global:
  pattern: aap-starter-kit
  singleArgoCD: true
  vpNewFolderDir: true
  secretLoader:
    disabled: false
  hub:
    provider: aws
  options:
    installPlanApproval: Automatic
    syncPolicy: Automatic
    useCSV: false
  singleArgoCD: true
main:
  # Variants live under variants/<name>/values-<name>.yaml
  # minimal-aap | aap-with-hub | aap-with-ao | complete-aap-ao
  # Keep clusterGroup/variant names short: {name}-gitops-server-{pattern}-{name}
  # must be <= 63 characters.
  variant: minimal-aap
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: 0.9.*
